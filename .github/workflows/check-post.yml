name: check-post

on:
  pull_request:
    paths: ["posts/**", "drafts/**", "suite/**", "tools/**", "test/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm test
      - name: Suite files match their definitions
        run: node tools/build-suite.ts --check
      - name: Fetch the signed registry for linked events
        run: |
          curl -fsSL --max-time 60 -o "$RUNNER_TEMP/snapshot.json" https://allthingsn.github.io/swapcheck-registry/snapshot.json \
            && curl -fsSL --max-time 60 -o "$RUNNER_TEMP/snapshot.json.sig" https://allthingsn.github.io/swapcheck-registry/snapshot.json.sig \
            || echo "The registry is not reachable; posts must carry their linked events in report.json."
      - name: Check every post bundle
        run: node tools/check-post.ts --all posts --registry "$RUNNER_TEMP/snapshot.json"
